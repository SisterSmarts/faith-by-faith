<style>

/*========================================
RESET
========================================*/

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Montserrat',sans-serif;

background:#faf7f5;

color:#2b2030;

line-height:1.8;

-webkit-font-smoothing:antialiased;

}

/*========================================
COLOURS
========================================*/

:root{

--plum:#4d014d;
--gold:#d9a631;
--cream:#faf7f5;
--white:#ffffff;
--text:#2b2030;
--soft:#6b5d68;

}

/*========================================
GLOBAL
========================================*/

section{

padding:110px 8%;

}

.container{

max-width:1300px;

margin:auto;

}

.section-title{

font-family:'Cormorant Garamond',serif;

font-size:64px;

font-weight:600;

color:var(--plum);

line-height:1.1;

text-align:center;

margin-bottom:18px;

}

.section-subtitle{

max-width:850px;

margin:0 auto 60px;

text-align:center;

font-size:20px;

color:var(--soft);

line-height:1.9;

}

/*========================================
TOP BAR
========================================*/

.topbar{

background:var(--plum);

color:white;

text-align:center;

padding:12px;

font-size:13px;

font-weight:600;

letter-spacing:3px;

}

/*========================================
NAVIGATION
========================================*/

nav{

display:flex;

justify-content:space-between;

align-items:center;

padding:22px 8%;

background:white;

box-shadow:0 3px 18px rgba(0,0,0,.05);

position:sticky;

top:0;

z-index:999;

}

.logo img{

height:72px;

display:block;

}

.menu{

display:flex;

gap:30px;

align-items:center;

flex-wrap:wrap;

}

.menu a{

text-decoration:none;

color:#433a45;

font-size:15px;

font-weight:500;

transition:.3s;

}

.menu a:hover{

color:var(--plum);

}

/*========================================
BUTTONS
========================================*/

.btn{

display:inline-flex;

align-items:center;

justify-content:center;

padding:17px 34px;

border-radius:50px;

font-weight:600;

text-decoration:none;

transition:.35s;

cursor:pointer;

}

.btn:hover{

transform:translateY(-4px);

box-shadow:0 14px 35px rgba(0,0,0,.10);

}

.btn-primary{

background:var(--plum);

color:white;

}

.btn-secondary{

background:white;

border:2px solid var(--gold);

color:var(--plum);

}

/*========================================
HERO
========================================*/

.hero{

background:linear-gradient(to bottom,#fdfcfc,#f7f2f5);

padding:55px 8% 45px;

}

.hero-content{

max-width:1450px;

margin:auto;

display:grid;

grid-template-columns:340px 1fr;

gap:90px;

align-items:center;

}

.hero-logo{

display:flex;

justify-content:center;

align-items:flex-start;

padding-top:25px;

}

.podcast-logo{

width:220px;

height:auto;

border-radius:50%;

box-shadow:0 20px 55px rgba(77,1,77,.14);

transition:.35s;

}

.podcast-logo:hover{

transform:translateY(-6px);

}

.hero-text{

text-align:left;

}

.hero-text h1{

font-family:'Cormorant Garamond',serif;

font-size:88px;

font-weight:600;

line-height:1;

color:var(--plum);

margin-bottom:18px;

}

.tagline{

font-size:31px;

font-weight:400;

color:#5d5160;

line-height:1.9;

margin-bottom:35px;

}

.quote{

font-family:'Cormorant Garamond',serif;

font-size:30px;

font-style:italic;

color:#7a6575;

line-height:1.7;

max-width:820px;

}

.quote span{

display:block;

margin-top:18px;

font-family:'Montserrat',sans-serif;

font-size:15px;

font-style:normal;

font-weight:700;

letter-spacing:3px;

text-transform:uppercase;

color:var(--plum);

}

.hero-buttons{

display:flex;

gap:18px;

margin-top:42px;

flex-wrap:wrap;

}
